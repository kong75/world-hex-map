name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small code sample or repository link.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the relevant Flutter, Node.js, browser, and framework versions.
      placeholder: Flutter 3.x or Node.js 20 / Chrome 130
    validations:
      required: true
